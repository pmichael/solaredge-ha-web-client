[project]
name = "solaredge-ha-web-client"
version = "0.1.0"
description = "Home Assistant integration for per-optimizer SolarEdge data"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "CPY",
    "EM101",
    "EM102",
    "TRY003",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN401", "D103", "D104", "D401", "SLF001", "DTZ001", "ARG001", "PT022"]
"custom_components/solaredge_ha_web_client/models.py" = ["ANN401"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "solaredge_web.*"
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
